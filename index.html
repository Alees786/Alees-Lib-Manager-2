<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance — We'll Be Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080E;
            --bg-secondary: #0F0F1A;
            --fg: #F0EDE6;
            --muted: #5A5A72;
            --accent: #FF6B35;
            --accent-glow: rgba(255, 107, 53, 0.3);
            --mint: #00E5A0;
            --mint-glow: rgba(0, 229, 160, 0.2);
            --card: rgba(15, 15, 26, 0.7);
            --border: rgba(90, 90, 114, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Animated grid background --- */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(90,90,114,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(90,90,114,0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* --- Floating orbs --- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: var(--accent);
            top: -100px; left: -100px;
            animation: orbFloat1 12s ease-in-out infinite;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: var(--mint);
            bottom: -80px; right: -80px;
            animation: orbFloat2 15s ease-in-out infinite;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: #6C3AED;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 10s ease-in-out infinite;
            opacity: 0.2;
        }
        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(80px, 60px) scale(1.1); }
            66% { transform: translate(-40px, 100px) scale(0.9); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-60px, -80px) scale(1.15); }
            66% { transform: translate(50px, -40px) scale(0.85); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.4); }
        }

        /* --- Canvas for particles --- */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Main content --- */
        .main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* --- Gear assembly animation --- */
        .gear-assembly {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 2.5rem;
        }
        .gear {
            position: absolute;
            color: var(--accent);
            filter: drop-shadow(0 0 20px var(--accent-glow));
        }
        .gear-1 {
            font-size: 5rem;
            top: 0; left: 0;
            animation: spinCW 6s linear infinite;
        }
        .gear-2 {
            font-size: 3rem;
            top: 10px; right: -10px;
            color: var(--mint);
            filter: drop-shadow(0 0 15px var(--mint-glow));
            animation: spinCCW 4s linear infinite;
        }
        .gear-3 {
            font-size: 2.2rem;
            bottom: -5px; left: 20px;
            color: var(--muted);
            animation: spinCW 3s linear infinite;
        }
        @keyframes spinCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* --- Floating fragments around gears --- */
        .fragment {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 2px;
            animation: fragFloat 4s ease-in-out infinite;
        }
        .frag-1 { background: var(--accent); top: -15px; left: 50%; animation-delay: 0s; }
        .frag-2 { background: var(--mint); top: 40%; right: -25px; animation-delay: 0.8s; }
        .frag-3 { background: var(--fg); bottom: -15px; left: 30%; animation-delay: 1.6s; opacity: 0.4; }
        .frag-4 { background: var(--accent); top: 20%; left: -20px; animation-delay: 2.4s; width: 6px; height: 6px; }
        .frag-5 { background: var(--mint); bottom: 10%; right: -20px; animation-delay: 3.2s; width: 5px; height: 5px; }

        @keyframes fragFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-12px) rotate(180deg); opacity: 0.3; }
        }

        /* --- Title --- */
        .title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--mint) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--muted);
            text-align: center;
            max-width: 500px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* --- Progress section --- */
        .progress-section {
            width: 100%;
            max-width: 420px;
            margin-bottom: 2.5rem;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .progress-label {
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }
        .progress-percent {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--mint));
            width: 0%;
            transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0; top: -2px;
            width: 10px; height: 10px;
            background: var(--mint);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--mint-glow), 0 0 30px var(--mint-glow);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 12px var(--mint-glow), 0 0 30px var(--mint-glow); transform: scale(1); }
            50% { box-shadow: 0 0 20px var(--mint-glow), 0 0 50px var(--mint-glow); transform: scale(1.3); }
        }

        /* --- Status cards --- */
        .status-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 500px;
            margin-bottom: 2.5rem;
        }
        .status-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem 1rem;
            text-align: center;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }
        .status-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,107,53,0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .status-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,107,53,0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .status-card:hover::before { opacity: 1; }
        .status-icon {
            font-size: 1.4rem;
            margin-bottom: 0.6rem;
            display: block;
        }
        .status-card:nth-child(1) .status-icon { color: var(--accent); }
        .status-card:nth-child(2) .status-icon { color: var(--mint); }
        .status-card:nth-child(3) .status-icon { color: #F59E0B; }
        .status-card-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        .status-card-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--fg);
        }

        /* --- Email form --- */
        .notify-section {
            width: 100%;
            max-width: 460px;
            margin-bottom: 2.5rem;
        }
        .notify-label {
            font-size: 0.85rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 400;
        }
        .notify-form {
            display: flex;
            gap: 0;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--card);
            backdrop-filter: blur(12px);
            transition: border-color 0.3s;
        }
        .notify-form:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .notify-input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: transparent;
            border: none;
            outline: none;
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
        }
        .notify-input::placeholder { color: var(--muted); }
        .notify-btn {
            padding: 1rem 1.75rem;
            background: linear-gradient(135deg, var(--accent), #FF8F5E);
            border: none;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .notify-btn:hover {
            background: linear-gradient(135deg, #FF8F5E, var(--accent));
            padding-left: 2rem;
            padding-right: 2rem;
        }
        .notify-btn:active { transform: scale(0.97); }

        /* --- Toast --- */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--card);
            border: 1px solid var(--mint);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 999;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s;
            opacity: 0;
            box-shadow: 0 12px 40px rgba(0,229,160,0.15);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast-icon { color: var(--mint); font-size: 1.2rem; }
        .toast-text { font-size: 0.9rem; color: var(--fg); }

        /* --- Social links --- */
        .social-links {
            display: flex;
            gap: 0.75rem;
        }
        .social-link {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 1.1rem;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
            text-decoration: none;
        }
        .social-link:hover {
            color: var(--fg);
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255,107,53,0.15);
        }

        /* --- Scanline overlay --- */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
        }

        /* --- Vignette --- */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, var(--bg) 100%);
        }

        /* --- Typing cursor on subtitle --- */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- Stagger fade-in --- */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Reduced motion --- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* --- Responsive --- */
        @media (max-width: 560px) {
            .status-cards {
                grid-template-columns: 1fr;
                max-width: 280px;
            }
            .gear-assembly { width: 120px; height: 120px; }
            .gear-1 { font-size: 3.5rem; }
            .gear-2 { font-size: 2rem; top: 5px; right: -5px; }
            .gear-3 { font-size: 1.5rem; bottom: 0; left: 15px; }
            .notify-form { flex-direction: column; border-radius: 14px; }
            .notify-btn { justify-content: center; border-radius: 0 0 13px 13px; padding: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Background layers -->
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Main content -->
    <main class="main-content">
        <!-- Gear assembly -->
        <div class="gear-assembly fade-up" style="animation-delay: 0.1s" aria-label="Animated gears indicating maintenance">
            <i class="fa-solid fa-gear gear gear-1"></i>
            <i class="fa-solid fa-gear gear gear-2"></i>
            <i class="fa-solid fa-gear gear gear-3"></i>
            <div class="fragment frag-1"></div>
            <div class="fragment frag-2"></div>
            <div class="fragment frag-3"></div>
            <div class="fragment frag-4"></div>
            <div class="fragment frag-5"></div>
        </div>

        <!-- Title -->
        <h1 class="title fade-up" style="animation-delay: 0.25s">Under Maintenance</h1>

        <!-- Subtitle with typing effect -->
        <p class="subtitle fade-up" style="animation-delay: 0.4s">
            <span id="typedText"></span><span class="cursor-blink"></span>
        </p>

        <!-- Progress bar -->
        <div class="progress-section fade-up" style="animation-delay: 0.55s">
            <div class="progress-header">
                <span class="progress-label">Rebuild Progress</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Status cards -->
        <div class="status-cards fade-up" style="animation-delay: 0.7s">
            <div class="status-card">
                <i class="fa-solid fa-server status-icon"></i>
                <div class="status-card-title">Servers</div>
                <div class="status-card-value" id="serverStatus">Syncing</div>
            </div>
            <div class="status-card">
                <i class="fa-solid fa-shield-halved status-icon"></i>
                <div class="status-card-title">Security</div>
                <div class="status-card-value">Patched</div>
            </div>
            <div class="status-card">
                <i class="fa-solid fa-clock status-icon"></i>
                <div class="status-card-title">ETA</div>
                <div class="status-card-value" id="etaValue">--:--:--</div>
            </div>
        </div>

        <!-- Notify form -->
        <div class="notify-section fade-up" style="animation-delay: 0.85s">
            <p class="notify-label">Get notified the moment we're back online</p>
            <form class="notify-form" id="notifyForm" autocomplete="off">
                <input
                    type="email"
                    class="notify-input"
                    id="emailInput"
                    placeholder="you@example.com"
                    required
                    aria-label="Email address for notification"
                >
                <button type="submit" class="notify-btn">
                    <i class="fa-solid fa-bell"></i>
                    Notify Me
                </button>
            </form>
        </div>

        <!-- Social links -->
        <nav class="social-links fade-up" style="animation-delay: 1s" aria-label="Social media links">
            <a href="#" class="social-link" aria-label="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="social-link" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="#" class="social-link" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-link" aria-label="Status page"><i class="fa-solid fa-signal"></i></a>
        </nav>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toast" role="alert">
        <i class="fa-solid fa-circle-check toast-icon"></i>
        <span class="toast-text" id="toastText">You're on the list!</span>
    </div>

    <script>
        // ==========================================
        // Particle system on canvas
        // ==========================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: -1000, y: -1000 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Track mouse for particle interaction
        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.1;
                // Pick color: accent orange or mint green
                this.color = Math.random() > 0.5 ? '255,107,53' : '0,229,160';
            }
            update() {
                // Mouse repulsion
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const force = (120 - dist) / 120;
                    this.x += (dx / dist) * force * 2;
                    this.y += (dy / dist) * force * 2;
                }

                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap around edges
                if (this.x < -10) this.x = canvas.width + 10;
                if (this.x > canvas.width + 10) this.x = -10;
                if (this.y < -10) this.y = canvas.height + 10;
                if (this.y > canvas.height + 10) this.y = -10;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color},${this.opacity})`;
                ctx.fill();
            }
        }

        // Create particles based on screen size
        const particleCount = Math.min(80, Math.floor((window.innerWidth * window.innerHeight) / 15000));
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        const opacity = (1 - dist / 150) * 0.12;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(240,237,230,${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawConnections();
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ==========================================
        // Typing effect for subtitle
        // ==========================================
        const phrases = [
            "We're rebuilding something better behind the scenes.",
            "Upgrading our systems for a faster experience.",
            "New features are being bolted into place.",
            "Almost there — the finish line is in sight."
        ];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typedEl = document.getElementById('typedText');

        function typeEffect() {
            const current = phrases[phraseIndex];
            if (!isDeleting) {
                typedEl.textContent = current.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === current.length) {
                    isDeleting = true;
                    setTimeout(typeEffect, 2500); // Pause at full text
                    return;
                }
                setTimeout(typeEffect, 40 + Math.random() * 30);
            } else {
                typedEl.textContent = current.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    setTimeout(typeEffect, 400);
                    return;
                }
                setTimeout(typeEffect, 20);
            }
        }
        setTimeout(typeEffect, 800);

        // ==========================================
        // Animated progress bar
        // ==========================================
        const targetProgress = 73; // Simulated rebuild progress
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressTrack = progressFill.parentElement;

        let currentProgress = 0;
        function animateProgress() {
            if (currentProgress < targetProgress) {
                currentProgress += 0.5;
                const val = Math.min(currentProgress, targetProgress);
                progressFill.style.width = val + '%';
                progressPercent.textContent = Math.round(val) + '%';
                progressTrack.setAttribute('aria-valuenow', Math.round(val));
                requestAnimationFrame(animateProgress);
            }
        }
        setTimeout(animateProgress, 1200);

// ==========================================
// Countdown ETA timer (12 hours from now)
// ==========================================
const etaEl = document.getElementById('etaValue');
const etaTarget = Date.now() + (12 * 60 * 60 * 1000); // 12 hours
let countdownDone = false;

function updateETA() {
    const remaining = Math.max(0, etaTarget - Date.now());

    if (remaining <= 0 && !countdownDone) {
        countdownDone = true;
        etaEl.textContent = 'Soon...';
        etaEl.style.color = 'var(--mint)';
        etaEl.style.animation = 'pulseGlow 1.5s ease-in-out infinite';

        // Bump progress to 100%
        currentProgress = 100;
        progressFill.style.width = '100%';
        progressPercent.textContent = '100%';
        progressTrack.setAttribute('aria-valuenow', 100);

        requestAnimationFrame(updateETA);
        return;
    }

    if (!countdownDone) {
        const h = String(Math.floor(remaining / 3600000)).padStart(2, '0');
        const m = String(Math.floor((remaining % 3600000) / 60000)).padStart(2, '0');
        const s = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
        etaEl.textContent = `${h}:${m}:${s}`;
    }

    requestAnimationFrame(updateETA);
}
updateETA();

        // ==========================================
        // Server status cycling
        // ==========================================
        const serverStatuses = ['Syncing', 'Migrating', 'Optimizing', 'Building'];
        let statusIdx = 0;
        const serverEl = document.getElementById('serverStatus');
        setInterval(() => {
            statusIdx = (statusIdx + 1) % serverStatuses.length;
            serverEl.style.opacity = '0';
            serverEl.style.transition = 'opacity 0.3s';
            setTimeout(() => {
                serverEl.textContent = serverStatuses[statusIdx];
                serverEl.style.opacity = '1';
            }, 300);
        }, 3000);

        // ==========================================
        // Email notification form
        // ==========================================
        const form = document.getElementById('notifyForm');
        const emailInput = document.getElementById('emailInput');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) return;

            // Basic validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address.', false);
                return;
            }

            showToast(`You're on the list! We'll notify ${email}`, true);
            emailInput.value = '';
        });

        function showToast(message, success) {
            toastText.textContent = message;
            const icon = toast.querySelector('.toast-icon');
            if (success) {
                toast.style.borderColor = 'var(--mint)';
                icon.className = 'fa-solid fa-circle-check toast-icon';
                icon.style.color = 'var(--mint)';
            } else {
                toast.style.borderColor = 'var(--accent)';
                icon.className = 'fa-solid fa-circle-exclamation toast-icon';
                icon.style.color = 'var(--accent)';
            }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
